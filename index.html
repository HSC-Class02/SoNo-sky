<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoNo-sky Financial Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>body{margin:0;font-family:system-ui,sans-serif;background:#f5f8ff;color:#0b1736}.hero{background:#155eef;color:white;padding:38px 6vw}.wrap{max-width:1200px;margin:22px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e4eaf5;border-radius:16px;padding:20px;margin-bottom:16px}.kpi{font-size:28px;font-weight:800}.muted{color:#667085;font-size:13px}.charts{display:grid;grid-template-columns:2fr 1fr;gap:16px}.chart{height:330px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px;border-bottom:1px solid #e4eaf5;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f8faff}.tabs button{border:1px solid #d0d5dd;background:white;border-radius:999px;padding:8px 14px;margin:3px}.tabs .on{background:#155eef;color:white}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="muted" style="color:#dbe7ff">DART × GitHub Automated Financial Agent</div><h1 id="title">SoNo-sky Financial Dashboard</h1><div id="updated"></div></header><main class="wrap"><div id="kpis" class="grid"></div><section class="charts"><div class="panel"><h3>Annual 매출 / 영업이익 / 순이익</h3><div class="chart"><canvas id="trend"></canvas></div></div><div class="panel"><h3>수익성 지표</h3><div class="chart"><canvas id="ratio"></canvas></div></div></section><section class="panel"><div class="tabs"><button class="on" onclick="show('annual',this)">Annual</button><button onclick="show('half',this)">Half-year</button><button onclick="show('quarterly',this)">Quarterly</button></div><div id="table"></div></section><section class="panel"><h2>국내 Peer Firms</h2><div id="peers"></div><p class="muted">사업부문 유사성을 참고한 비교군입니다.</p></section></main><script>let D;const money=v=>v==null?'—':(v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0})+'억',pct=v=>v==null?'—':(v*100).toFixed(1)+'%';function rec(p){return(D.records||[]).filter(x=>p==='quarterly'?['q1','q3'].includes(x.period):x.period===p).sort((a,b)=>b.year-a.year)}function table(p){let rs=rec(p),cs=[['revenue','매출액'],['operating_income','영업이익'],['net_income','순이익'],['assets','자산'],['liabilities','부채'],['equity','자본'],['operating_margin','영업이익률'],['debt_ratio','부채비율'],['current_ratio','유동비율'],['roe','ROE']];if(!rs.length)return'<p class="muted">수집된 데이터가 없습니다. DART_API_KEY를 입력한 후 workflow를 실행하세요.</p>';return'<table><thead><tr><th>연도/기간</th>'+cs.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr><td>'+r.year+' · '+r.period+'</td>'+cs.map(c=>'<td>'+(['operating_margin','debt_ratio','current_ratio','roe'].includes(c[0])?pct(r.metrics[c[0]]):money(r.metrics[c[0]]))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function show(p,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('#table').innerHTML=table(p)}async function init(){D=await fetch('data/financial_data.json?'+Date.now()).then(r=>r.json());document.querySelector('#title').textContent=(D.company?.name||'SoNo-sky')+' Financial Dashboard';document.querySelector('#updated').textContent='최종 업데이트: '+(D.generated_at||'대기중');let a=rec('annual'),m=(a[0]?.metrics||{});document.querySelector('#kpis').innerHTML=[['매출액',money(m.revenue)],['영업이익',money(m.operating_income)],['순이익',money(m.net_income)],['부채비율',pct(m.debt_ratio)]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="kpi">'+x[1]+'</div></div>').join('');new Chart(document.querySelector('#trend'),{type:'line',data:{labels:a.slice().reverse().map(x=>x.year),datasets:[{label:'매출',data:a.slice().reverse().map(x=>x.metrics.revenue/1e8)},{label:'영업이익',data:a.slice().reverse().map(x=>x.metrics.operating_income/1e8)},{label:'순이익',data:a.slice().reverse().map(x=>x.metrics.net_income/1e8)}]},options:{responsive:true,maintainAspectRatio:false}});new Chart(document.querySelector('#ratio'),{type:'bar',data:{labels:['영업이익률','순이익률','ROA','ROE'],datasets:[{data:['operating_margin','net_margin','roa','roe'].map(k=>(m[k]||0)*100)}]},options:{responsive:true,maintainAspectRatio:false}});show('annual',document.querySelector('.tabs button'));document.querySelector('#peers').innerHTML='<table><thead><tr><th>기업</th><th>종목코드</th><th>비교 근거</th></tr></thead><tbody>'+(D.peers||[]).map(p=>'<tr><td>'+p.name+'</td><td>'+p.ticker+'</td><td>'+p.note+'</td></tr>').join('')+'</tbody></table>'}init()</script></body></html>
